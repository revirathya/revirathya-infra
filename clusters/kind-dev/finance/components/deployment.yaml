apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: finance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: core
          image: revirathya/revirathya-finance-core:0.1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "256Mi"
              cpu: "1"
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: app-env
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: client-id
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: log-level
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: database-username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: database-password
            - name: DATABASE_URI
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@postgres-cluster-rw.postgres.svc.cluster.local:5432/finance?sslmode=require"
            - name: GRPC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: service-credentials
                  key: grpc-api-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: service-credentials
                  key: jwt-secret
          ports:
          - name: grpc
            containerPort: 50051
          - name: graphql
            containerPort: 8080
          - name: metrics
            containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            failureThreshold: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      initContainers:
        - name: migration
          image: revirathya/revirathya-finance-migration:0.1.0
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: database-username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: database-password
            - name: DATABASE_URI
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@postgres-cluster-rw.postgres.svc.cluster.local:5432/finance?sslmode=require"
          args:
            - "-database=$(DATABASE_URI)"
            - "up"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        supplementalGroups: [4000]
