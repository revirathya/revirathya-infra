apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: core-ingress
  namespace: finance
spec:
  ingressClassName: traefik
  rules:
    - host: revirathya.localhost
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  name: http
